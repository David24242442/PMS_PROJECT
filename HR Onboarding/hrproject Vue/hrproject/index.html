<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon_melcom.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    
    <title>Melcom HR Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Suppress benign third-party browser extension errors (e.g. autofill / password managers / web vitals)
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          var s = String(msg);
          return s.indexOf('startTime') !== -1 || s.indexOf('reportAllChanges') !== -1 || s.indexOf('ResizeObserver') !== -1 || s.indexOf('insecure connection') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (e && (shouldSuppress(e.message) || (e.error && shouldSuppress(e.error.message)) || (e.filename === '' && e.lineno === 2))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && shouldSuppress(e.reason.message || e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        var oldOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (shouldSuppress(msg) || (lineNo === 2 && (!url || url === ''))) return true;
          if (oldOnError) return oldOnError.apply(this, arguments);
          return false;
        };
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return (a && a.stack) ? a.stack : String(a); }).join(' ');
          if (shouldSuppress(msg)) return;
          origConsoleError.apply(console, arguments);
        };
        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return (a && a.stack) ? a.stack : String(a); }).join(' ');
          if (shouldSuppress(msg)) return;
          origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <script>if(localStorage.getItem('hr-theme')==='dark')document.body.classList.add('dark-mode');</script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
  </body>
</html>
